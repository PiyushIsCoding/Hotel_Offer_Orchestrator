services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/temporal:latest
    restart: unless-stopped
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --namespace
      - default
    ports:
      - "7233:7233"
      - "8233:8233"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_TASK_QUEUE: hotel-offers
      TEMPORAL_NAMESPACE: default
      REDIS_URL: redis://redis:6379
      HOTEL_CACHE_TTL_SECONDS: 900
      SUPPLIERS_BASE_URL: http://api:3000
      HEALTHCHECK_DEPENDENCIES: "true"
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "dist/temporal/worker.js"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_TASK_QUEUE: hotel-offers
      TEMPORAL_NAMESPACE: default
      REDIS_URL: redis://redis:6379
      HOTEL_CACHE_TTL_SECONDS: 900
      SUPPLIERS_BASE_URL: http://api:3000
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
      api:
        condition: service_healthy

volumes:
  redis-data:
